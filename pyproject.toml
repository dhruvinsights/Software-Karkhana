[project]
name = "karkhana"
version = "0.1.0"
description = "Software Karkhana: one record for every team from idea to merged code, built on Google Cloud and Gemini."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    # Agents and models (Agent Starter Pack baseline).
    "google-adk>=1.31.0,<2.0.0",
    "google-genai>=1.73.0,<2.0.0",
    "pyyaml>=6.0,<7.0",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    # Google Cloud.
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-run>=0.10.0,<1.0.0",
    "google-cloud-storage>=2.18.0,<4.0.0",
    "cloud-sql-python-connector[asyncpg]>=1.18.0,<2.0.0",
    "firebase-admin>=6.5.0,<8.0.0",
    # Web and data.
    "fastapi>=0.115.8,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30.0,<1.0.0",
    "pgvector>=0.3.6,<1.0.0",
    "httpx>=0.28,<1.0",
    # Transactional email via Resend.
    "resend>=2.0.0,<3.0.0",
    # The worker runs the demo repo's tests inside the same image.
    "pytest>=8.3.4,<9.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-timeout>=2.3.1,<3.0.0",
    "ruff>=0.8.0,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[project.optional-dependencies]
eval = ["google-adk[eval]>=1.31.0,<2.0.0"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["web", "demo-repo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C4", "B", "UP", "RUF", "D", "S", "ASYNC"]
ignore = [
    "E501",   # Formatter owns line length.
    "D105", "D107",
    "S101",   # Asserts are fine in tests.
    "S603", "S607", # The worker runs git and pytest by design, with fixed argv.
    "RUF012",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S", "F811"]
"app/scripts/**" = ["D103", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
unresolved-import = "ignore"
unresolved-attribute = "ignore"
possibly-missing-attribute = "ignore"

[tool.codespell]
skip = "./web/node_modules,./web/dist,uv.lock,.venv,*.json,package-lock.json"

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# A hung test fails with a full stack trace instead of stalling silently.
# 120 s is generous: on a cold Windows machine the first test also pays for
# importing google-genai (antivirus scans every new .pyc).
timeout = 120
faulthandler_timeout = 60

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.agent-starter-pack]
name = "karkhana"
description = "Software Karkhana control plane with ADK Coder and Reviewer agents"
base_template = "adk"
agent_directory = "app"
asp_version = "0.41.3"

[tool.agent-starter-pack.create_params]
deployment_target = "cloud_run"
session_type = "in_memory"
cicd_runner = "google_cloud_build"
include_data_ingestion = false
datastore = "none"
